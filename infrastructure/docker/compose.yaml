name: haqpos
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-haqpos}
      POSTGRES_USER: ${POSTGRES_USER:-haqpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD outside Git}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      # PostgreSQL 18 keeps versioned PGDATA under this directory.
      - postgres_data:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Haqpos: Host=db;Port=5432;Database=${POSTGRES_DB:-haqpos};Username=${POSTGRES_USER:-haqpos};Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      AllowedHosts: ${APP_HOST:-haqpos.hospital.local};localhost;127.0.0.1;api
      ReverseProxy__KnownProxy: 172.30.43.10
    depends_on:
      db:
        condition: service_healthy
    networks: [database, application]
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    ports:
      # Loopback by default. TI may bind explicitly to the hospital LAN address.
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ${TLS_CERT_PATH:?Define absolute TLS_CERT_PATH}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?Define absolute TLS_KEY_PATH}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      application:
        ipv4_address: 172.30.43.10
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  database:
    internal: true
  application:
    internal: true
    ipam:
      config:
        - subnet: 172.30.43.0/24
